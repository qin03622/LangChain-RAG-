# MedRAG 默认配置（可被 .env 环境变量覆盖）
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 2048

embedding:
  provider: openai
  model: text-embedding-3-small

retrieval:
  strategy: mmr
  top_k: 5
  fetch_k: 20
  mmr_lambda: 0.5
  score_threshold: 0.0
  use_rerank: false

text_splitter:
  chunk_size: 800
  chunk_overlap: 150

clinical:
  mode: precise              # precise | comprehensive
  use_hyde: false
  use_multi_query: false
  multi_query_count: 3
  use_rerank: true
  rerank_model: "BAAI/bge-reranker-base"
  precise_top_k: 4
  comprehensive_top_k: 10
  guideline_boost: 1.3

memory:
  enabled: true
  ttl_seconds: 3600
  max_turns: 12
  auto_purge_sensitive: true
  store_dir: ./sessions

feedback:
  enabled: true
  store_path: ./feedback.jsonl
  tuning_enabled: true

specialty:
  # 面向临床医护的专项辅助功能（7 项）
  enabled: true
  knowledge_strict: true        # 结构化知识仅采用已标注来源的条目
  top_k: 6
  append_disclaimer: true       # 强制追加免责声明
  warn_diagnosis_assertion: true # 检测“确诊式”表述并警示

# ============ 功能四：知识库管理后台 ============
knowledge_base:
  enabled: true
  registry_path: ./knowledge_base/registry.json   # 文档登记库
  upload_dir: ./knowledge_base/uploads            # 上传暂存目录
  candidate_buffer: 15                            # 失效/权限过滤的召回缓冲
  default_visibility: public                      # public | department | confidential
  categories:                                     # 预置分类目录
    - 临床指南
    - 药学
    - 检验
    - 内科
    - 外科
    - 急诊
    - 儿科
    - 护理
    - 感染控制
  debug:
    top_k: 5                    # 检索测试面板默认返回数
    use_rerank: true            # 默认展示重排结果
    chunk_size: 0               # 0 表示用全局 chunk_size

# ============ 功能五：后台运维 & 统计 ============
ops:
  enabled: true
  query_log_path: ./ops/query_log.jsonl   # 问答统计日志（JSONL，只增不改）
  param_store_path: ./ops/runtime_params.json  # 运行时可调参数持久化
  rag_enabled: true                       # RAG 开关：true=RAG 检索增强；false=纯 LLM 模式
  rerank_threshold: 0.0                   # Rerank 最低得分阈值，0 表示不过滤
  # 可调参数初值（可被 .env / 运维 API 覆盖）：
  # chunk_size / chunk_overlap 见 text_splitter；top_k 见 retrieval；use_hyde 见 clinical

# ============ 专项知识库来源说明（由 data/raw 文档提供，均须标注版本/来源） ============
# 药典 / 药品说明书 / 药物临床应用指南 / 诊疗指南 / 专家共识
# 所有条目为教学演示用简化示例，生产环境请替换为审核过的权威知识源。

safety:
  enable_guard: true
  disclaimer: "以上内容由 AI 辅助生成，仅供参考，不能替代执业医师的诊断与处方。请务必咨询专业医疗机构。"

# ============ 功能三：安全 / 合规 / 风控 ============
safety_compliance:
  filter_enabled: true          # 前置内容过滤：违规意图拦截
  desensitize_enabled: true     # 隐私脱敏预处理（姓名/手机/身份证/住址）
  default_role: patient         # patient 患者端（严格）| clinician 医护端（专业）
  audit_enabled: true           # 全量审计留痕
  audit_store_path: ./audit.jsonl
